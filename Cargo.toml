[workspace]
resolver = "2"
members = [
    "crates/foundation/core",
    "crates/representations/analytic/linear",
    "crates/representations/analytic/curve",
    "crates/representations/analytic/surface",
    "crates/representations/analytic/primitive",
    "crates/representations/region/profile",
    "crates/representations/topology",
    "crates/representations/fixtures",
    "crates/representations/brep",
    "crates/representations/discrete/mesh",
    "crates/representations/sampled/field",
    "crates/representations/modeling/graph",
    "crates/contracts/guarantees",
    "crates/contracts/common/base",
    "crates/contracts/common/mesh",
    "crates/contracts/operations/compile",
    "crates/contracts/operations/exact-compile",
    "crates/contracts/operations/mesh-boolean",
    "crates/contracts/operations/mesh-section",
    "crates/contracts/operations/tessellate",
    "crates/algorithms/predicates",
    "crates/algorithms/reference",
    "crates/algorithms/parametric/evaluate",
    "crates/algorithms/parametric/nurbs",
    "crates/algorithms/construction/construct",
    "crates/algorithms/planar/overlay",
    "crates/algorithms/planar/project",
    "crates/algorithms/planar/route",
    "crates/algorithms/query/intersection/linear",
    "crates/algorithms/query/intersection/ray-mesh",
    "crates/algorithms/query/spatial",
    "crates/algorithms/query/inspect",
    "crates/algorithms/query/measure",
    "crates/algorithms/sampled/field",
    "crates/algorithms/repair/heal",
    "crates/algorithms/discrete/decimate",
    "crates/algorithms/discrete/decompose",
    "crates/algorithms/discrete/refine",
    "crates/algorithms/sampled/levelset",
    "crates/providers/mesh/boolmesh",
    "crates/execution/compile",
    "crates/execution/dispatch",
    "crates/execution/cpu",
    "crates/execution/gpu",
    "crates/facade/axiolid",
    "crates/facade/axiolid-capi",
    "tools/oracle",
    "tools/xtask",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.88"
license = "MPL-2.0"
authors = ["point-grey"]
repository = "https://github.com/axiolid/kernel"
homepage = "https://axiolid.github.io/kernel/"
readme = "README.md"

[workspace.dependencies]
# Format-agnostic Axiolid geometry kernel. Leaf crates remain independently consumable.
axiolid = { path = "crates/facade/axiolid", version = "0.11.0", default-features = false }
axiolid-core = { path = "crates/foundation/core", version = "0.11.0" }
axiolid-mesh = { path = "crates/representations/discrete/mesh", version = "0.11.0" }
axiolid-model = { path = "crates/representations/modeling/graph", version = "0.11.0" }
axiolid-primitive = { path = "crates/representations/analytic/primitive", version = "0.11.0" }
axiolid-heal = { path = "crates/algorithms/repair/heal", version = "0.11.0" }
axiolid-decimate = { path = "crates/algorithms/discrete/decimate", version = "0.11.0" }
axiolid-decompose = { path = "crates/algorithms/discrete/decompose", version = "0.11.0" }
axiolid-refine = { path = "crates/algorithms/discrete/refine", version = "0.11.0" }
axiolid-levelset = { path = "crates/algorithms/sampled/levelset", version = "0.11.0" }
axiolid-evaluate = { path = "crates/algorithms/parametric/evaluate", version = "0.11.0" }
axiolid-nurbs = { path = "crates/algorithms/parametric/nurbs", version = "0.11.0" }
axiolid-construct = { path = "crates/algorithms/construction/construct", version = "0.11.0" }
axiolid-profile = { path = "crates/representations/region/profile", version = "0.11.0" }
axiolid-curve = { path = "crates/representations/analytic/curve", version = "0.11.0" }
axiolid-linear = { path = "crates/representations/analytic/linear", version = "0.11.0", default-features = false }
axiolid-surface = { path = "crates/representations/analytic/surface", version = "0.11.0" }
axiolid-topology = { path = "crates/representations/topology", version = "0.11.0" }
axiolid-brep = { path = "crates/representations/brep", version = "0.11.0" }
axiolid-tessellation-contract = { path = "crates/contracts/operations/tessellate", version = "0.11.0" }
axiolid-spatial = { path = "crates/algorithms/query/spatial", version = "0.11.0" }
axiolid-inspect = { path = "crates/algorithms/query/inspect", version = "0.11.0" }
axiolid-measure = { path = "crates/algorithms/query/measure", version = "0.11.0" }
axiolid-fixtures = { path = "crates/representations/fixtures", version = "0.11.0" }
axiolid-overlay = { path = "crates/algorithms/planar/overlay", version = "0.11.0" }
axiolid-project = { path = "crates/algorithms/planar/project", version = "0.11.0" }
axiolid-route = { path = "crates/algorithms/planar/route", version = "0.11.0" }
axiolid-field = { path = "crates/representations/sampled/field", version = "0.11.0" }
axiolid-field-ops = { path = "crates/algorithms/sampled/field", version = "0.11.0", default-features = false }
i_overlay = "4.5.2"
axiolid-predicates = { path = "crates/algorithms/predicates", version = "0.11.0", default-features = false }
axiolid-linear-intersection = { path = "crates/algorithms/query/intersection/linear", version = "0.11.0", default-features = false }
axiolid-ray-mesh = { path = "crates/algorithms/query/intersection/ray-mesh", version = "0.11.0", default-features = false }
axiolid-reference = { path = "crates/algorithms/reference", version = "0.11.0" }
axiolid-mesh-compile = { path = "crates/execution/compile", version = "0.11.0" }
# axiolid-oracle is publish = false (test-only oracle crate, tools/oracle) and
# only ever used as a dev-dependency. No version pin here: Cargo strips a
# versionless path dev-dependency when packaging, so downstream crates that
# depend on axiolid-nurbs never need axiolid-oracle to exist on crates.io.
axiolid-oracle = { path = "tools/oracle" }
axiolid-contracts = { path = "crates/contracts/common/base", version = "0.11.0" }
axiolid-guarantees = { path = "crates/contracts/guarantees", version = "0.11.0" }
axiolid-mesh-contracts = { path = "crates/contracts/common/mesh", version = "0.11.0" }
axiolid-mesh-compile-contract = { path = "crates/contracts/operations/compile", version = "0.11.0" }
axiolid-exact-compile-contract = { path = "crates/contracts/operations/exact-compile", version = "0.11.0" }
axiolid-mesh-boolean-contract = { path = "crates/contracts/operations/mesh-boolean", version = "0.11.0" }
axiolid-mesh-section-contract = { path = "crates/contracts/operations/mesh-section", version = "0.11.0" }
axiolid-dispatch = { path = "crates/execution/dispatch", version = "0.11.0", default-features = false }
axiolid-backend-cpu = { path = "crates/execution/cpu", version = "0.11.0", default-features = false }
axiolid-backend-gpu = { path = "crates/execution/gpu", version = "0.11.0", default-features = false }
axiolid-mesh-boolean-boolmesh = { path = "crates/providers/mesh/boolmesh", version = "0.11.0" }
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
cargo_metadata = "0.19"
cbindgen = "0.29.0"
rustc_lexer = "0.1.0"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
