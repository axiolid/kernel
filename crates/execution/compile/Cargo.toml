[package]
name = "axiolid-mesh-compile"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description = "Scalar reference MeshCompiler: profiles, extrusion, transforms, boolean dispatch."

[dependencies]
axiolid-core.workspace = true
axiolid-mesh.workspace = true
axiolid-model.workspace = true
axiolid-topology.workspace = true
axiolid-primitive.workspace = true
axiolid-profile.workspace = true
axiolid-curve.workspace = true
axiolid-construct.workspace = true
axiolid-contracts.workspace = true
axiolid-guarantees.workspace = true
axiolid-mesh-contracts.workspace = true
axiolid-mesh-boolean-contract.workspace = true
axiolid-mesh-compile-contract.workspace = true
axiolid-exact-compile-contract.workspace = true
axiolid-brep.workspace = true
axiolid-reference.workspace = true
axiolid-surface.workspace = true
earcut = "0.4"

[dev-dependencies]
# The measurement oracle. `volume_properties` audits closed-two-manifoldness
# before it integrates, so using it makes the extrusion tests assert
# watertightness and volume in one call instead of trusting a hand-rolled
# divergence sum that would happily integrate a broken mesh.
axiolid-measure.workspace = true
axiolid-mesh-boolean-boolmesh.workspace = true
axiolid-mesh-section-contract.workspace = true
axiolid-dispatch = { workspace = true, features = ["mesh-section"] }

[package.metadata.axiolid]
architecture-version = 1
layer = "execution"
role = "execution.orchestration"
domain = "graph.compile"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-mesh-boolean-boolmesh", "axiolid-core", "axiolid-curve", "axiolid-construct", "axiolid-contracts", "axiolid-dispatch", "axiolid-guarantees", "axiolid-mesh-boolean-contract", "axiolid-mesh-compile-contract", "axiolid-exact-compile-contract", "axiolid-brep", "axiolid-mesh-contracts", "axiolid-mesh-section-contract", "axiolid-measure", "axiolid-mesh", "axiolid-model", "axiolid-primitive", "axiolid-profile", "axiolid-reference", "axiolid-surface", "axiolid-topology"]
