[package]
name = "axiolid-dispatch"
description = "Provider registration, ordering, fallback, and execution policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = []
mesh-boolean = ["dep:axiolid-core", "dep:axiolid-mesh", "dep:axiolid-mesh-contracts", "dep:axiolid-mesh-boolean-contract"]
mesh-section = ["dep:axiolid-core", "dep:axiolid-mesh", "dep:axiolid-mesh-contracts", "dep:axiolid-mesh-section-contract"]
pointcloud-reconstruction = ["dep:axiolid-pointcloud", "dep:axiolid-pointcloud-reconstruction-contract"]

[dependencies]
axiolid-contracts.workspace = true
axiolid-core = { workspace = true, optional = true }
axiolid-mesh = { workspace = true, optional = true }
axiolid-mesh-contracts = { workspace = true, optional = true }
axiolid-mesh-boolean-contract = { workspace = true, optional = true }
axiolid-mesh-section-contract = { workspace = true, optional = true }
axiolid-pointcloud = { workspace = true, optional = true }
axiolid-pointcloud-reconstruction-contract = { workspace = true, optional = true }

[package.metadata.axiolid]
architecture-version = 1
layer = "execution"
role = "execution.dispatch"
domain = "providers"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-contracts", "axiolid-core", "axiolid-mesh", "axiolid-mesh-boolean-contract", "axiolid-mesh-contracts", "axiolid-mesh-section-contract", "axiolid-pointcloud", "axiolid-pointcloud-reconstruction-contract", "axiolid-pointcloud-reconstruction-sdf"]

[dev-dependencies]
axiolid-pointcloud-reconstruction-sdf.workspace = true
axiolid-mesh.workspace = true
axiolid-pointcloud.workspace = true
axiolid-core.workspace = true
axiolid-pointcloud-reconstruction-contract.workspace = true
