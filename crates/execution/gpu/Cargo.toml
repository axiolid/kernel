[package]
name = "axiolid-backend-gpu"
description = "GPU executor adapter contract for batched Axiolid geometry"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = []

[dependencies]
axiolid-mesh.workspace = true
axiolid-model.workspace = true
axiolid-contracts.workspace = true
axiolid-mesh-compile-contract.workspace = true

[dev-dependencies]
axiolid-core.workspace = true
# The out-of-tree executor gate builds a simulated native backend using only
# published items, proving a real CUDA/HIP bridge needs no privileged access.
axiolid-model.workspace = true
axiolid-mesh.workspace = true

[package.metadata.axiolid]
architecture-version = 1
layer = "execution"
role = "execution.context"
domain = "gpu"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core", "axiolid-contracts", "axiolid-mesh", "axiolid-mesh-compile-contract", "axiolid-model"]
