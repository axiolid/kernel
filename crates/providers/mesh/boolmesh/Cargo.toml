[package]
name = "axiolid-mesh-boolean-boolmesh"
description = "boolmesh-backed MeshBoolean provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
axiolid-core.workspace = true
axiolid-mesh.workspace = true
axiolid-contracts.workspace = true
axiolid-mesh-contracts.workspace = true
axiolid-mesh-boolean-contract.workspace = true
# The mesh boolean is absorbed into `src/csg` (ADR 0047), not depended
# upon. `glam` is what that code is written against; `axiolid-core` pins
# 0.29, which lacks the USizeVec3 the absorbed code uses.
glam = "0.30"
rayon = { version = "1.11", optional = true }

[features]
# Upstream multi-threading. OFF by default: the parallel path has not been
# audited for run-to-run byte stability, and `determinism()` drops to
# `BestEffort` when it is on, so `Plan::admit` refuses a stronger request
# rather than silently returning a schedule-dependent result.
parallel = ["dep:rayon"]

[[bench]]
name = "subtract_many"
harness = false

[dev-dependencies]
# Upstream, for the absorption differential test ONLY (ADR 0047). The
# production path uses `src/csg`; this pin exists so a port bug shows up
# as a failing comparison rather than as silently different geometry.
boolmesh = { version = "0.1.9", default-features = false }
# The scalar oracle, used only for differential testing (ADR 0012). A
# dev-dependency deliberately: the production provider must never depend on the
# reference implementation at runtime.
axiolid-reference.workspace = true
# The certified exact predicates, used to re-decide the provider's orientation
# choices independently (#24). Dev-only for the same reason as the reference
# oracle: production dispatch must not depend on the checker.
axiolid-predicates.workspace = true
axiolid-guarantees.workspace = true
# The shared adversarial corpus (#18) and mesh measures, consumed by the
# corpus-driven differential tests (#8).
axiolid-fixtures.workspace = true
axiolid-measure.workspace = true
axiolid-dispatch = { workspace = true, features = ["mesh-boolean"] }

[package.metadata.axiolid]
architecture-version = 1
layer = "providers"
role = "provider.mesh"
domain = "mesh.boolean"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core", "axiolid-contracts", "axiolid-dispatch", "axiolid-fixtures", "axiolid-guarantees", "axiolid-measure", "axiolid-mesh", "axiolid-mesh-boolean-contract", "axiolid-mesh-contracts", "axiolid-predicates", "axiolid-reference"]
