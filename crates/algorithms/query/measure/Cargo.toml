[package]
name = "axiolid-measure"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description = "Metric properties: area, volume, centroid, moments of inertia."

[dependencies]
axiolid-core.workspace = true
axiolid-mesh.workspace = true
axiolid-brep = { workspace = true, optional = true }
axiolid-surface = { workspace = true, optional = true }
axiolid-topology = { workspace = true, optional = true }

[features]
# Exact B-rep measurement. OFF by default: a mesh-only consumer must not
# acquire analytic surfaces and exact topology just to measure a mesh, which
# the `mesh-rule-checker` closure profile enforces.
exact = ["dep:axiolid-brep", "dep:axiolid-surface", "dep:axiolid-topology"]

[package.metadata.axiolid]
architecture-version = 1
layer = "algorithms"
role = "algorithm.query"
domain = "query.measure"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-brep", "axiolid-core", "axiolid-mesh", "axiolid-surface", "axiolid-topology"]
