[package]
name = "axiolid-nurbs"
description = "General polynomial and rational B-spline analysis and transformation algorithms"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
axiolid-core.workspace = true
axiolid-curve.workspace = true
axiolid-contracts.workspace = true
axiolid-guarantees.workspace = true
axiolid-evaluate.workspace = true
axiolid-predicates.workspace = true
axiolid-surface.workspace = true

[dev-dependencies]
# axiolid-oracle carries no crates.io version (publish = false, test-only);
# `workspace = true` resolves it through the versionless path entry in
# [workspace.dependencies] so cargo package strips it cleanly.
axiolid-oracle.workspace = true

[package.metadata.axiolid]
architecture-version = 1
layer = "algorithms"
role = "algorithm.parametric"
domain = "parametric.nurbs"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core", "axiolid-curve", "axiolid-contracts", "axiolid-guarantees", "axiolid-evaluate", "axiolid-oracle", "axiolid-predicates", "axiolid-surface"]
