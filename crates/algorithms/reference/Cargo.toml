[package]
name = "axiolid-reference"
description = "Portable scalar reference implementation and certified predicates"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
axiolid-core.workspace = true
axiolid-predicates.workspace = true
axiolid-contracts.workspace = true
axiolid-guarantees.workspace = true
axiolid-mesh-contracts.workspace = true
axiolid-mesh-boolean-contract.workspace = true
axiolid-mesh-section-contract.workspace = true
axiolid-curve.workspace = true
axiolid-evaluate.workspace = true
axiolid-measure.workspace = true
axiolid-mesh.workspace = true
axiolid-primitive.workspace = true
axiolid-surface.workspace = true
axiolid-spatial.workspace = true

[[bench]]
name = "clash"
harness = false

[dev-dependencies]
axiolid-dispatch = { workspace = true, features = ["mesh-section"] }

[package.metadata.axiolid]
architecture-version = 1
layer = "algorithms"
role = "algorithm.reference"
domain = "reference"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core", "axiolid-curve", "axiolid-evaluate", "axiolid-predicates", "axiolid-contracts", "axiolid-dispatch", "axiolid-guarantees", "axiolid-mesh-boolean-contract", "axiolid-mesh-contracts", "axiolid-mesh-section-contract", "axiolid-measure", "axiolid-mesh", "axiolid-primitive", "axiolid-spatial", "axiolid-surface"]
