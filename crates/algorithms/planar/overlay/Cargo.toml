[package]
name = "axiolid-overlay"
description = "Deterministic validated planar overlay contract"
version = "0.3.20"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
axiolid-contracts.workspace = true
axiolid-core.workspace = true
axiolid-exact.workspace = true
axiolid-guarantees.workspace = true
i_overlay.workspace = true

[package.metadata.axiolid]
