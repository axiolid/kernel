[package]
name = "axiolid-construct"
description = "Solid generation: profiles, lofts, sweeps, revolutions and half-space clipping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
axiolid-brep.workspace = true
axiolid-core.workspace = true
axiolid-curve.workspace = true
axiolid-contracts.workspace = true
axiolid-guarantees.workspace = true
axiolid-predicates.workspace = true
axiolid-mesh-contracts.workspace = true
axiolid-mesh-boolean-contract.workspace = true
axiolid-mesh.workspace = true
axiolid-nurbs.workspace = true
axiolid-primitive.workspace = true
axiolid-overlay.workspace = true
axiolid-profile.workspace = true
axiolid-reference.workspace = true
axiolid-surface.workspace = true
axiolid-topology.workspace = true
axiolid-tessellation-contract.workspace = true
axiolid-brep-audit.workspace = true
earcut = "0.4"
[dev-dependencies]
axiolid-heal.workspace = true
# The measurement oracle. `volume_properties` audits closed-two-manifoldness
# before it integrates, so using it makes the generation tests assert
# watertightness and volume in one call instead of trusting a hand-rolled
# divergence sum that would happily integrate a broken mesh.
axiolid-measure = { workspace = true, features = ["exact"] }
axiolid-evaluate.workspace = true

[package.metadata.axiolid]
architecture-version = 1
layer = "algorithms"
role = "algorithm.construction"
domain = "construction"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-brep", "axiolid-core", "axiolid-curve", "axiolid-contracts", "axiolid-evaluate", "axiolid-brep-audit", "axiolid-guarantees", "axiolid-heal", "axiolid-mesh-boolean-contract", "axiolid-mesh-contracts", "axiolid-measure", "axiolid-mesh", "axiolid-nurbs", "axiolid-overlay", "axiolid-predicates", "axiolid-primitive", "axiolid-profile", "axiolid-reference", "axiolid-surface", "axiolid-tessellation-contract", "axiolid-topology"]
