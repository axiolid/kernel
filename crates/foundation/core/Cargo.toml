[package]
name = "axiolid-core"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
description = "Geometry data types and tolerance policy. No algorithms, no backends."

# ROOT OF THE GRAPH — no internal dependencies, ever.
[features]
default = []
# Serialize/Deserialize for the geometry graph wire format (ADR 0085).
serde = ["dep:serde", "glam/serde"]

[dependencies]
glam.workspace = true
serde = { workspace = true, optional = true }

[package.metadata.axiolid]
architecture-version = 1
layer = "foundation"
role = "foundation.values"
domain = "numeric"
public = true
format-neutral = true
allowed-internal-dependencies = []
