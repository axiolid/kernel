[package]
name = "axiolid-capi"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description = "Versioned, memory-safe C ABI for the Axiolid application facade."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
axiolid = { workspace = true, default-features = false, features = ["application"] }

[package.metadata.axiolid]
architecture-version = 1
layer = "facade"
role = "facade.native-c"
domain = "integration"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid"]
