[package]
name = "axiolid"
description = "Feature-gated facade for Axiolid's format-neutral geometry stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = ["mesh", "cpu", "integration"]
integration = ["contracts"]

# Representation capabilities. These features are additive.
mesh = ["dep:axiolid-mesh"]
# Linear values and their certified queries. A line-only application should
# depend on the leaf packages directly; these features exist for convenience,
# not as a required route (ADR 0036).
linear = ["dep:axiolid-linear"]
predicates = ["dep:axiolid-predicates"]
linear-intersection = ["linear", "predicates", "dep:axiolid-linear-intersection"]
profiles = ["dep:axiolid-profile"]
curves = ["linear", "dep:axiolid-curve"]
surfaces = ["curves", "dep:axiolid-surface"]
topology = ["curves", "surfaces", "dep:axiolid-topology"]
brep = ["topology", "dep:axiolid-brep"]
primitives = ["dep:axiolid-primitive"]
model = [
    "mesh",
    "profiles",
    "curves",
    "surfaces",
    "topology",
    "primitives",
    "dep:axiolid-model",
]

# Algorithms. Heavy implementations remain optional.
evaluate = ["curves", "surfaces", "dep:axiolid-evaluate"]
nurbs = ["curves", "surfaces", "evaluate", "dep:axiolid-nurbs"]
tessellation = ["mesh", "curves", "surfaces", "topology", "dep:axiolid-tessellation-contract"]
spatial = ["mesh", "dep:axiolid-spatial"]
ray-mesh = ["mesh", "predicates", "dep:axiolid-ray-mesh"]
measure = ["mesh", "dep:axiolid-measure"]
overlay = ["dep:axiolid-overlay"]
project = ["mesh", "overlay", "dep:axiolid-project"]
route = ["overlay", "predicates", "dep:axiolid-route"]
field = ["dep:axiolid-field"]
# Point-sampled geometry. `pointcloud` is representation-only, so a consumer
# that just wants to hold scan data pays for nothing else.
pointcloud = ["dep:axiolid-pointcloud"]
pointcloud-queries = ["pointcloud", "spatial"]
pointcloud-reconstruction = [
    "pointcloud",
    "contracts",
    "mesh",
    "dep:axiolid-pointcloud-reconstruction-contract",
]
dispatch-pointcloud-reconstruction = [
    "pointcloud-reconstruction",
    "dep:axiolid-dispatch",
    "axiolid-dispatch/pointcloud-reconstruction",
]
pointcloud-provider = [
    "pointcloud-reconstruction",
    "dep:axiolid-pointcloud-reconstruction-sdf",
]
field-ops = ["field", "dep:axiolid-field-ops"]
field-navigation = ["field-ops", "axiolid-field-ops/navigation"]
heal = ["mesh", "dep:axiolid-heal"]
contracts = ["dep:axiolid-contracts"]
mesh-contracts = ["contracts", "mesh", "dep:axiolid-mesh-contracts"]
mesh-boolean = ["mesh-contracts", "dep:axiolid-mesh-boolean-contract"]
mesh-section = ["mesh-contracts", "dep:axiolid-mesh-section-contract"]
graph-compile = ["contracts", "model", "mesh", "dep:axiolid-mesh-compile-contract"]
dispatch-mesh-boolean = ["mesh-boolean", "dep:axiolid-dispatch", "axiolid-dispatch/mesh-boolean"]
dispatch-mesh-section = ["mesh-section", "dep:axiolid-dispatch", "axiolid-dispatch/mesh-section"]
generate = ["mesh", "profiles", "curves", "primitives", "mesh-boolean", "brep", "dep:axiolid-construct"]
portable-provider = ["dep:axiolid-mesh-boolean-boolmesh", "dep:axiolid-reference"]
application = ["discrete", "dispatch-mesh-boolean", "dispatch-mesh-section", "portable-provider"]

# Execution contexts and operation adapters. CPU stays portable by default;
# optimized paths are selected at runtime, never by building the whole crate for
# one host CPU.
cpu = ["dep:axiolid-backend-cpu"]
parallel = ["cpu", "axiolid-backend-cpu/parallel"]
simd = ["cpu", "axiolid-backend-cpu/simd"]
gpu = ["graph-compile", "dep:axiolid-backend-gpu"]

# Named bundles describe capability, not a source format.
discrete = [
    "integration",
    "mesh",
    "profiles",
    "primitives",
    "tessellation",
    "spatial",
    "ray-mesh",
    "measure",
    "mesh-boolean",
    "mesh-section",
    "generate",
    "cpu",
]
parametric = ["integration", "model", "curves", "surfaces", "topology", "nurbs"]
advanced = ["discrete", "parametric", "heal"]
full = ["advanced", "parallel", "simd", "gpu"]

[dependencies]
axiolid-core.workspace = true
axiolid-mesh = { workspace = true, optional = true }
axiolid-linear = { workspace = true, optional = true }
axiolid-predicates = { workspace = true, optional = true }
axiolid-linear-intersection = { workspace = true, optional = true }
axiolid-profile = { workspace = true, optional = true }
axiolid-curve = { workspace = true, optional = true }
axiolid-surface = { workspace = true, optional = true }
axiolid-topology = { workspace = true, optional = true }
axiolid-brep = { workspace = true, optional = true }
axiolid-primitive = { workspace = true, optional = true }
axiolid-model = { workspace = true, optional = true }
axiolid-evaluate = { workspace = true, optional = true }
axiolid-nurbs = { workspace = true, optional = true }
axiolid-tessellation-contract = { workspace = true, optional = true }
axiolid-spatial = { workspace = true, optional = true }
axiolid-ray-mesh = { workspace = true, optional = true }
axiolid-measure = { workspace = true, optional = true }
axiolid-overlay = { workspace = true, optional = true }
axiolid-project = { workspace = true, optional = true }
axiolid-route = { workspace = true, optional = true }
axiolid-field = { workspace = true, optional = true }
axiolid-pointcloud = { workspace = true, optional = true }
axiolid-pointcloud-reconstruction-contract = { workspace = true, optional = true }
axiolid-pointcloud-reconstruction-sdf = { workspace = true, optional = true }
axiolid-field-ops = { workspace = true, optional = true }
axiolid-heal = { workspace = true, optional = true }
axiolid-contracts = { workspace = true, optional = true }
axiolid-mesh-contracts = { workspace = true, optional = true }
axiolid-mesh-boolean-contract = { workspace = true, optional = true }
axiolid-mesh-boolean-boolmesh = { workspace = true, optional = true }
axiolid-mesh-section-contract = { workspace = true, optional = true }
axiolid-mesh-compile-contract = { workspace = true, optional = true }
axiolid-dispatch = { workspace = true, optional = true }
axiolid-construct = { workspace = true, optional = true }
axiolid-reference = { workspace = true, optional = true }
axiolid-backend-cpu = { workspace = true, optional = true }
axiolid-backend-gpu = { workspace = true, optional = true }

[package.metadata.axiolid]
architecture-version = 1
layer = "facade"
role = "facade"
domain = "public"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-backend-cpu", "axiolid-backend-gpu", "axiolid-brep", "axiolid-core", "axiolid-curve", "axiolid-linear", "axiolid-linear-intersection", "axiolid-predicates", "axiolid-project", "axiolid-route", "axiolid-field", "axiolid-field-ops", "axiolid-construct", "axiolid-heal", "axiolid-contracts", "axiolid-dispatch", "axiolid-evaluate", "axiolid-mesh-boolean-boolmesh",
    "axiolid-pointcloud",
    "axiolid-pointcloud-reconstruction-contract",
    "axiolid-pointcloud-reconstruction-sdf", "axiolid-mesh-boolean-contract", "axiolid-mesh-compile-contract", "axiolid-mesh-contracts", "axiolid-mesh-section-contract", "axiolid-measure", "axiolid-mesh", "axiolid-model", "axiolid-nurbs", "axiolid-overlay", "axiolid-primitive", "axiolid-profile", "axiolid-ray-mesh", "axiolid-reference", "axiolid-spatial", "axiolid-surface", "axiolid-tessellation-contract", "axiolid-topology"]
