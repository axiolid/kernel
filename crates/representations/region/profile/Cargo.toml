[package]
name = "axiolid-profile"
description = "Exact 2D profile representations for sweeps and sectioned solids"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
default = []
# Serialize/Deserialize for the geometry graph wire format (ADR 0085).
serde = ["dep:serde", "axiolid-core/serde", "axiolid-curve/serde"]

[dependencies]
axiolid-core.workspace = true
axiolid-curve.workspace = true
serde = { workspace = true, optional = true }

[package.metadata.axiolid]
architecture-version = 1
layer = "representations"
role = "representation.region"
domain = "region.profile"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core", "axiolid-curve"]
