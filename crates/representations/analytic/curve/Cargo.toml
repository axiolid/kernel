[package]
name = "axiolid-curve"
version = "0.3.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
description = "Exact, format-neutral curve values: lines, conics, B-splines, natural-equation and elevated curves."

[features]
default = []
# Serialize/Deserialize for the geometry graph wire format (ADR 0085).
serde = ["dep:serde", "axiolid-core/serde", "axiolid-linear/serde"]

[dependencies]
axiolid-core.workspace = true
axiolid-linear.workspace = true
serde = { workspace = true, optional = true }

[package.metadata.axiolid]
architecture-version = 1
layer = "representations"
role = "representation.atomic"
domain = "analytic.curve"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core", "axiolid-linear"]
