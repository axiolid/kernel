[package]
name = "axiolid-model"
version = "0.3.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
description = "Format-neutral geometry item tree. The currency between a format reader and a kernel."

[features]
default = []
# The versioned JSON and CBOR wire format of `GeometryGraph` (ADR 0085).
serde = [
    "dep:serde",
    "dep:serde_json",
    "dep:ciborium",
    "axiolid-core/serde",
    "axiolid-mesh/serde",
    "axiolid-profile/serde",
    "axiolid-primitive/serde",
    "axiolid-curve/serde",
    "axiolid-surface/serde",
    "axiolid-topology/serde",
]

[dependencies]
axiolid-core.workspace = true
axiolid-mesh.workspace = true
axiolid-profile.workspace = true
axiolid-primitive.workspace = true
axiolid-curve.workspace = true
axiolid-surface.workspace = true
axiolid-topology.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }

[dev-dependencies]
# The native-backend readiness gate parses the data-plane crates' own sources.
syn = { version = "2", features = ["full", "parsing", "visit"] }

# The wire tests use `serde_json` and `ciborium` from the `serde` feature.
[[test]]
name = "wire"
required-features = ["serde"]

[package.metadata.axiolid]
architecture-version = 1
layer = "representations"
role = "representation.graph"
domain = "modeling.graph"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core", "axiolid-curve", "axiolid-mesh", "axiolid-primitive", "axiolid-profile", "axiolid-surface", "axiolid-topology"]
