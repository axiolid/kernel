[package]
name = "axiolid-mesh"
version = "0.3.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
description = "Triangle meshes: the discrete representation every backend consumes."

[features]
default = []
# Serialize/Deserialize for the geometry graph wire format (ADR 0085).
serde = ["dep:serde", "axiolid-core/serde"]

[dependencies]
axiolid-core.workspace = true
serde = { workspace = true, optional = true }

[package.metadata.axiolid]
architecture-version = 1
layer = "representations"
role = "representation.discrete"
domain = "discrete.mesh"
public = true
format-neutral = true
allowed-internal-dependencies = ["axiolid-core"]
