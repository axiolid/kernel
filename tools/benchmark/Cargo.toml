[package]
name = "axiolid-benchmark"
description = "Internal benchmarking foundation: workloads, validation, and regression measurement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
# Never published. This is measurement scaffolding for the kernel's own
# development, not a public capability, and keeping it unpublished keeps it out
# of the release cascade entirely.
publish = false

[dependencies]
axiolid = { workspace = true, features = ["application", "dispatch-mesh-section"] }
axiolid-core.workspace = true
axiolid-mesh.workspace = true
axiolid-curve.workspace = true
axiolid-predicates.workspace = true
axiolid-guarantees.workspace = true
axiolid-measure.workspace = true
axiolid-spatial.workspace = true

[dev-dependencies]
criterion.workspace = true
# The exact placed-openings benchmark (#228) compiles a graph exactly and
# validates the volume before timing; the boundary-distance benchmark (#273)
# measures between the exact elements it compiles.
axiolid-brep.workspace = true
axiolid-contracts.workspace = true
axiolid-exact-compile-contract.workspace = true
axiolid-measure = { workspace = true, features = ["exact"] }
axiolid-mesh-compile.workspace = true
axiolid-model.workspace = true
axiolid-profile.workspace = true
iai-callgrind = "0.16.1"

[package.metadata.axiolid]
architecture-version = 1
layer = "tools"
role = "tool.benchmark"
domain = "workspace"
public = false
format-neutral = true
allowed-internal-dependencies = [
    "axiolid",
    "axiolid-core",
    "axiolid-mesh",
    "axiolid-curve",
    "axiolid-predicates",
    "axiolid-guarantees",
    "axiolid-measure",
    "axiolid-spatial",
    "axiolid-brep",
    "axiolid-contracts",
    "axiolid-exact-compile-contract",
    "axiolid-mesh-compile",
    "axiolid-model",
    "axiolid-profile",
]

[[bench]]
name = "scenario"
harness = false

[[bench]]
name = "audit"
harness = false

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "regression"
harness = false

[[bench]]
name = "exact_openings"
harness = false

[[bench]]
name = "boundary_distance"
harness = false
