[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cargo_metadata.workspace = true
cbindgen.workspace = true
rustc_lexer.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Already in the lock via cbindgen: the capability ledger is too wide a
# schema (22 issues, 95 rows, nested arrays) for a hand parser to stay
# correct, unlike the fixed-shape closure profiles.
toml = "0.9"

[package.metadata.axiolid]
architecture-version = 1
layer = "tools"
role = "tool.architecture"
domain = "workspace"
public = false
format-neutral = true
allowed-internal-dependencies = []
