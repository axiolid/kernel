summary = "boundary_distance returns an interval certain to contain the distance between the boundaries of two exact B-reps, with witness points on both (ADR 0074): branch and bound over face patches and edge spans, lower bounds from Lipschitz spheres and exact projection ranges (planes, cylinders, elliptical cylinders, cones, spheres, tori; line/circle/ellipse edges), upper bounds only from points certified on the boundary, normal-cone pruning of non-critical patches. boundary_clearance compares with a limit and answers Below, Above or Indeterminate. Primitive/mesh witnesses (ClosestPoints3, mesh_distance) remain. Distance is between boundaries, not a containment classification; B-spline faces are bounded by their whole control net. Plan relations (#217): plan_boundary_distance and plan_boundary_clearance certify the distance between the bodies' XY projections by the same search with horizontal gaps, directions and enclosing discs (zero for overlap and for containment in plan); plan_overlap shows a positive-area overlap from two non-vertical planar faces or a certified gap. Hausdorff (#224): boundary_hausdorff_distance and one_sided_boundary_hausdorff return intervals certain to contain the two-sided and one-sided Hausdorff distances between two exact boundaries, with witnesses, refined to a requested accuracy: lower bounds from points certified on the boundary measured by the same search, upper bounds from face patches bounded by a matched face of the other boundary (same family and trim, |S_A - S_B| over the patch: exact for a translation, zero for a re-export; or, for a face trimmed in another chart (#227), a translate with the same axes and shape whose trims agree after the induced parameter shift, re-charted with the trim residue folded in, bound |t|; a turned or resized face is never matched so) or by the 1-Lipschitz distance about a point, and lower bounds seeded with the support point against each matched displacement. Translated and identical copies close at any accuracy, prisms trimmed in world coordinates included; one_sided_boundary_hausdorff_with_budget caps the splits; other pairs close at first order in the patch size, and a fixed budget leaves a sound but wider interval. Multi-solid bodies (#229): body_boundary_distance and body_boundary_clearance take a slice of B-reps per side and certify the least distance over item pairs by one shared search, witnesses naming their items; body_boundary_hausdorff_distance and one_sided_body_boundary_hausdorff(_with_budget) certify the Hausdorff distance between the boundaries of the unions once every pair of items in a body is shown apart (a separating plane with a certified gap, or a positive boundary gap with neither inside the other), touching without a shared patch of face, or in exact face contact on an axis plane (each face in contact cut to its free region by an exact arc arrangement, so a column on its footing, blocks sharing a wall and stacked steps measure their union), and refuse contact on planes no axis is normal to, near contact (with its gap), faces that cannot be cut and items not shown apart by name (BodyMeasureError); gaps are measured, never glued. A PlacedBody (items in the body frame plus one rigid placement) is cut in its own frame and then placed, so bodies turned in any direction keep their contact cut. Translated multi-item bodies close as fast as one solid, cut faces bounded through the faces they were cut from."
