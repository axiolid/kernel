[[capability]]
id = "A5"
area = "foundations"
name = "linear algebra / root finding / optimisation / integration"
level = "narrow"
summary = "axiolid-numeric (no dependencies, plain f64) exposes: Brent root finding on a sign-change bracket, returning the final bracket as a proven bound; every real root of a power-basis polynomial in an interval, isolated by derivative roots with rigorous Horner rounding bounds, multiple roots and inseparable clusters reported as unresolved regions with the most roots they can hold; adaptive Gauss-Kronrod G7/K15 quadrature with QUADPACK's error estimate (endpoint singularities by refinement) and fixed Gauss-Legendre rules up to 512 points; LU with partial pivoting, Cholesky, column-pivoted Householder QR with numerical rank, linear least squares and equality-constrained least squares (null-space method), each with a Hager-Higham condition estimate and a forward error estimate; Levenberg-Marquardt (More scaling, augmented QR steps, analytic or forward-difference Jacobian) for nonlinear least squares and square equation systems; and Brent's bounded scalar minimiser. Iterative routines report a status and keep their best value and estimate when a budget runs out. Refused by name: non-finite input or function values, unbracketed roots, the zero polynomial, singular, rank-deficient, asymmetric and indefinite matrices, redundant constraints. Not built: eigenvalue and singular value decompositions, linear and quadratic programming (CGAL QP_solver), multivariate gradient and global minimisers (BFGS, Powell, PSO), double-exponential and multidimensional quadrature, and all-roots search for non-polynomial functions. Older inline routines (bisection and an 8-point Gauss rule in axiolid-evaluate, the interpolation solve in axiolid-nurbs) are unchanged."
