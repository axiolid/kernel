[[capability]]
id = "B10"
area = "curves-surfaces"
name = "surface-surface intersection (analytic + general)"
level = "implemented"
summary = "Analytic pairs are complete. exact_surface_intersection derives lines, circles and ellipses in closed form, with case decisions (tangent, parallel, perpendicular) exact on the given doubles; ruled quadric sections (ADR 0076) as root branches of a quadratic over the carrier angle; torus sections against planes and spheres in closed form; a plane through a cone apex as rays along its rulings; and every remaining analytic pair (a torus against a cylinder, cone or torus off-axis) as a traced implicit section (ADR 0077): the other surface's equation read in the carrier's parameters, traced into certified monotone cells by subdivision, so no component is missed for want of a step. B-spline surfaces against analytic ones are traced the same way on piecewise Bernstein fields over the spline's Bezier patches (implicit_surface_intersection), clipped to its domain. Isolated touching points are recognised, and branches crossing or touching each other where the surfaces touch (a saddle, or higher-order contact such as a tacnode) meet at a vertex, joined to it by bridges matching each branch's value and slope; surfaces tangent along a whole curve meet along it (a line of contact, traced as a derivative's zeros) where they cross, and add no section where they only touch; any order of contact is traced as a derivative's zeros; B-spline fields decide signs below f64 rounding exactly (dyadic Bernstein arithmetic behind an interval filter), and analytic series fields where they are flat (along a line of contact or at a singular point) with certified arithmetic (#181): exact zeros by a Laurent identity in the harmonics' common angle, point signs by fixed-point intervals at rising precision, box signs by Bernstein coefficients of a certified Taylor form; so no trace has a precision limit, and lines of contact that rounding hides over more than a twentieth of the window are traced on either kind of field. Two B-spline surfaces meet in a section carried on both (spline_pair_intersection, Curve3::PairSection): Bezier sub-patch pairs (cut to the windows) are split until their normal cones are apart, so no closed loop can hide in one; every crossing of a sub-patch edge is isolated by Krawczyk's test on Bernstein enclosures, seeding every component; each curve is followed on both surfaces and every chord proven to follow one arc by a parametric Krawczyk test, or refused."
evidence = ["crates/algorithms/parametric/nurbs/src/certified_surface_surface_intersection.rs::intersect_surface_surface_certified", "crates/algorithms/parametric/nurbs/src/exact_surface_intersection.rs::exact_surface_intersection", "crates/algorithms/parametric/nurbs/src/ruled_section.rs", "crates/algorithms/parametric/nurbs/tests/exact_intersection.rs", "crates/algorithms/parametric/nurbs/tests/ruled_section.rs", "scripts/probe_ruled_section_mutants.py", "crates/execution/compile/tests/surface_curve_sweep.rs", "crates/algorithms/parametric/nurbs/src/implicit_section.rs::implicit_surface_intersection", "crates/algorithms/parametric/nurbs/src/implicit_trace.rs::trace", "crates/algorithms/parametric/nurbs/src/spline_field.rs::spline_section_field", "crates/algorithms/parametric/nurbs/tests/implicit_section.rs", "crates/algorithms/parametric/nurbs/tests/spline_section.rs", "crates/algorithms/parametric/nurbs/src/pair_trace.rs::spline_pair_intersection", "crates/algorithms/parametric/nurbs/tests/pair_section.rs", "scripts/probe_pair_section_mutants.py", "crates/algorithms/parametric/nurbs/src/pair_certify.rs::certify_chord", "crates/algorithms/parametric/nurbs/src/exact_field.rs::Exact", "scripts/probe_crossing_mutants.py", "crates/algorithms/parametric/nurbs/src/exact_series.rs::SeriesTier", "crates/algorithms/exact/src/fixed.rs::FixedInterval", "scripts/probe_exact_series_mutants.py"]
