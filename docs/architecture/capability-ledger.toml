summary = "axiolid-spatial exposes barycentric coordinates for 2D and 3D triangles (3D answers for the orthogonal projection onto the plane) and tetrahedra, as signed sub-area and sub-volume ratios, exact at corners; mean-value coordinates (Floater, in Hormann-Floater form) for simple 2D polygons, convex or not, either winding; Wachspress coordinates (determinant form of Meyer, Lee, Barr and Desbrun) and discrete harmonic coordinates (Pinkall-Polthier cotangent weights) for strictly convex 2D polygons, either winding; and mean-value coordinates in 3D (Floater, Kos and Reimers) over a closed triangle mesh given as vertices and face index triples. All reproduce the point exactly inside and interpolate the boundary linearly (Wachspress and discrete harmonic on a convex polygon's edges and vertices, mean-value-3D on a mesh vertex or a face's own plane inside its triangle). Refused by name: non-finite input, shapes thinner than the linear tolerance, polygons with under three vertices, short edges or edges meeting (checked pairwise), a polygon that is not strictly convex for Wachspress and discrete harmonic, an out-of-range face vertex index for the 3D mesh case, and points where the weights cancel or a denominator vanishes (mean-value outside a non-convex polygon; Wachspress on the extended line of a non-adjacent edge; discrete harmonic at a collinear fan angle). Not built: natural-neighbour (Sibson) interpolation."
