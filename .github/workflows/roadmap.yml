name: Roadmap freshness

# The roadmap explains ordering and reasoning; the project board carries status.
# This gate stops the roadmap drifting back into a status page that goes stale.
# It also covers crate `PLAN.md` design notes, which drifted the same way
# (kernel#25), so their paths must trigger it too.

on:
  push:
    branches: [main]
    paths:
      - "docs/ROADMAP.md"
      - "crates/PLAN.md"
      - "crates/**/PLAN.md"
      - "scripts/check-roadmap-freshness.py"
      - ".github/workflows/roadmap.yml"
  pull_request:
    paths:
      - "docs/ROADMAP.md"
      - "crates/PLAN.md"
      - "crates/**/PLAN.md"
      - "scripts/check-roadmap-freshness.py"
      - ".github/workflows/roadmap.yml"
  # Milestones change outside of any commit, so re-check on a schedule too.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check roadmap does not duplicate live state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-roadmap-freshness.py
