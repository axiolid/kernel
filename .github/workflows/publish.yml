name: Publish crates

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: Choose publish to upload immutable crate versions to crates.io
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - publish

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Test release tooling and publication order
        run: |
          python3 scripts/test_release_scripts.py
          python3 scripts/publish-workspace.py
      - name: Bootstrap-preflight every publishable source archive
        run: python3 scripts/verify-packages.py

  publish:
    name: Publish to crates.io
    needs: verify
    if: inputs.release_action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: crates-io
      url: https://crates.io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Authenticate with crates.io (trusted publishing)
        # A short-lived token, revoked when the job ends. crates.io issues it
        # when ANY crate trusts this workflow and the `crates-io` environment,
        # but it only works for those crates, and it expires long before this
        # job's 6-hour budget.
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish workspace in stable dependency order
        # publish-workspace.py skips every version already on the registry,
        # so the fallback retry with the long-lived secret only publishes
        # what the trusted-publishing attempt did not (an unconfigured crate,
        # or everything after the token expired). The fallback goes away when
        # CARGO_REGISTRY_TOKEN is deleted; then a run that outlives the token
        # is finished by dispatching again.
        env:
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$OIDC_TOKEN" ] && CARGO_REGISTRY_TOKEN="$OIDC_TOKEN" \
              python3 scripts/publish-workspace.py --execute; then
            exit 0
          fi
          if [ -z "$FALLBACK_TOKEN" ]; then
            echo "::error::trusted publishing did not finish and no CARGO_REGISTRY_TOKEN fallback is set; dispatch again to resume"
            exit 1
          fi
          echo "::warning::finishing the publish with CARGO_REGISTRY_TOKEN (crate not trusted, or token expired)"
          CARGO_REGISTRY_TOKEN="$FALLBACK_TOKEN" python3 scripts/publish-workspace.py --execute
