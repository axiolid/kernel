[[profile]]
name = "cad-exact"
manifest = "tests/consumers/cad-exact/Cargo.toml"
description = "A CAD application: analytic curves/surfaces, topology, exact B-rep results, and NURBS."
features = []

# Before ADR 0036 phase 2 this closure was 18 packages: `axiolid-nurbs`
# depended on the `axiolid-reference` umbrella, so every CAD build compiled
# mesh, spatial, measure, and primitive. Rewiring NURBS to `axiolid-evaluate`
# removed that entire branch. Reintroducing it must be a reviewed decision.
