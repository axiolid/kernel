# Capability ledger: Axiolid against OCCT and CGAL, geometry only.
#
# One [[capability]] per geometry capability found in either reference
# library. Read it with `cargo xtask gaps list|show <id>`; `cargo xtask
# gaps check` (run by scripts/gate.sh) keeps it honest.
#
# Rules for editing:
# - A landing that changes a row's level updates it in the SAME commit.
# - `level` is implemented | narrow | scoped | absent. `scoped` means
#   deliberately not built (a designed refusal, or out of scope with no
#   consumer) and requires `scope_rationale`; `gaps` does not list it as
#   open work.
# - `narrow` means a named subset
#   works and everything else is refused by name; the summary says which.
# - `evidence` paths are workspace-relative, optionally `path::symbol`. The
#   gate checks the file exists and the symbol is defined in it. Narrow and
#   implemented rows must cite at least one.
# - `occt` / `cgal` are paths inside the pinned reference trees below:
#   where to read a mature implementation, not code to port.
# - `issue` is a key from [[issue]]; the issue's number is recorded there.
#   `blocked_by` mirrors GitHub's native issue dependencies; `gaps next`
#   skips an issue until every blocker's rows are implemented.
#
# Grades came from reading public functions and tests at `cb8d203`; see
# docs/research/geometry-capability-comparison-occt-cgal.md.

